name: image

on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'entrypoint.sh', '.github/workflows/image.yml']
  pull_request:
    paths: ['Dockerfile', 'entrypoint.sh', '.github/workflows/image.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Preinstalled on the runner image, so no action dependency.
      - run: shellcheck entrypoint.sh
      - run: sh entrypoint.sh --self-test

      # GHCR rejects uppercase in the image path; GitHub usernames allow it.
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # The gha cache backend needs the buildx driver; the default docker one cannot export.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests build but never push: an unreviewed image should not become :latest, and a
      # fork's token cannot write packages anyway. The sha tag is the rollback target - the base
      # image and winehq-staging are both unpinned, so :latest can shift under you at any rebuild.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/bannerlord-coop:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/bannerlord-coop:${{ github.sha }}
